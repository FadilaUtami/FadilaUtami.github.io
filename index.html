<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fadila Utami Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #004d40;
            --accent-gold: #c5a059;
            --white: #ffffff;
            --bg-light: #f3f5f6;
            --gray-box: #ebedee;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); margin: 0; padding: 20px; }
        .container { width: 98%; max-width: 1400px; margin: auto; }

        /* HEADER & NAVIGATION */
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; }
        .header h3 { color: var(--primary-green); margin: 0; font-size: 1.5rem; }
        .role-nav { display: flex; background: #fff; border-radius: 30px; padding: 4px; border: 1px solid #ddd; }
        .role-btn { border: none; padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: 600; background: transparent; color: #666; font-size: 0.8rem; transition: 0.3s; }
        .role-btn.active { background: var(--primary-green); color: white; }

        /* BENTO GRID - RATA KANAN (4 KOLOM) */
        .bento-grid { 
            display: grid; 
            grid-template-columns: 280px 240px 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 20px; 
        }

        .card { background: var(--white); border-radius: 12px; border: 3.5px solid var(--primary-green); padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .section-title { color: var(--accent-gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: bold; }

        /* PROFILE & ABOUT */
        .profile-card { grid-row: span 2; padding: 0; overflow: hidden; }
        .profile-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .about-card { grid-column: span 3; position: relative; }
        .about-card h2 { color: var(--primary-green); margin: 0; font-size: 1.8rem; }
        .about-card .sub-role { color: var(--accent-gold); font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; }

        /* STACKED ITEMS */
        .stack-container { display: flex; flex-direction: column; gap: 8px; }
        .stack-item { padding: 10px; border-radius: 10px; font-size: 0.8rem; display: flex; flex-direction: column; background: var(--gray-box); border: 1px solid #ddd; }
        .item-primary { background: var(--primary-green); color: white; border-color: var(--primary-green); }
        .item-primary b { color: var(--accent-gold); }

        /* SKILLS AREA */
        .skills-row { display: grid; grid-template-columns: 1.2fr 2fr; gap: 15px; margin-bottom: 20px; }
        .tech-skills-list { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
        .tech-icon { text-align: center; font-size: 0.7rem; color: #666; font-weight: bold; }
        .tech-icon i { font-size: 1.8rem; color: var(--secondary-green); display: block; margin-bottom: 5px; }
        .tag-box { background: var(--gray-box); padding: 6px 15px; border-radius: 25px; font-size: 0.8rem; border: 1px solid #ddd; font-weight: 600; margin-right: 5px; margin-bottom: 5px; display: inline-block; }

        /* PROJECT EXPERIENCE SECTION */
        .exp-outer-card { border: 3.5px solid var(--primary-green); border-radius: 12px; padding: 20px; background: #fff; }
        .project-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        
        /* CARD PROYEK */
        .project-card-front { background: var(--gray-box); border: 1px solid #ddd; border-radius: 12px; padding: 20px; position: relative; transition: 0.3s; }
        .project-card-front:hover { border-color: var(--primary-green); }
        .project-card-front h4 { color: var(--primary-green); margin: 0 0 8px 0; font-size: 1.1rem; }
        .project-desc { font-size: 0.8rem; color: #555; line-height: 1.5; margin-bottom: 15px; }
        
        .front-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .method-tags { display: flex; gap: 5px; flex-wrap: wrap; }
        .tool-tag { font-size: 0.65rem; background: #fff; padding: 3px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #ddd; color: var(--primary-green); }
        
        .btn-open-deck { background: var(--primary-green); color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; transition: 0.3s; }
        .btn-open-deck:hover { background: var(--accent-gold); }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); overflow-y: auto; }
        .modal-content { background: #fff; margin: 2% auto; padding: 30px; border: 3.5px solid var(--primary-green); width: 85%; max-width: 1000px; border-radius: 15px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; }
        .modal-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        .modal-info b { color: var(--primary-green); display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3>My Portfolio</h3>
        <div class="role-nav">
            <button id="nav-data" class="role-btn active" onclick="updatePage('data')">DATA ANALYST</button>
            <button id="nav-ci" class="role-btn" onclick="updatePage('ci')">CONTINUOUS IMPROVEMENT</button>
            <button id="nav-pm" class="role-btn" onclick="updatePage('pm')">PROJECT MANAGEMENT</button>
        </div>
    </div>

    <div class="bento-grid">
        <div class="card profile-card"><img src="Profile.png" alt="Profile"></div>
        <div class="card about-card">
            <div class="section-title">ABOUT ME</div>
            <h2 id="name">Fadila Utami</h2>
            <div id="role-title" class="sub-role">DATA ANALYST</div>
            <p id="about-desc" style="font-size: 0.9rem; line-height: 1.6;"></p>
        </div>
        <div class="card"><div class="section-title">CONTACT</div><div id="contact-content" class="stack-container"></div></div>
        <div class="card"><div class="section-title">EDUCATION</div><div id="edu-content" class="stack-container"></div></div>
        <div class="card"><div class="section-title">CERTIFICATIONS</div><div id="cert-content" class="stack-container"></div></div>
    </div>

    <div class="skills-row">
        <div class="card"><div class="section-title">TECHNICAL SKILLS</div><div id="tech-skills" class="tech-skills-list"></div></div>
        <div class="card"><div class="section-title">SOFT SKILLS</div><div id="soft-skills"></div></div>
    </div>

    <div class="exp-outer-card">
        <div id="exp-title" class="section-title">PROJECT EXPERIENCE</div>
        <div id="project-list" class="project-grid"></div>
    </div>
</div>

<div id="projectModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3 id="m-title" style="color: var(--primary-green); margin-top: 0;"></h3>
        <div class="modal-grid">
            <div><img id="m-image" src="" alt="Preview" style="width:100%; border:1px solid #ddd; border-radius: 8px;"></div>
            <div class="modal-info">
                <b>Background Problem:</b> <span id="m-bg"></span>
                <b>Objective:</b> <span id="m-obj"></span>
                <b>Method:</b> <span id="m-meth"></span>
                <b>Result:</b> <span id="m-res"></span>
            </div>
        </div>
        <div style="margin-top:20px; border-top:1px solid #ddd; padding-top:15px;">
            <a id="m-code" href="#" target="_blank" style="color:blue; font-weight:bold; text-decoration:none;"><i class="fa-solid fa-code"></i> View Code / BigQuery</a>
        </div>
    </div>
</div>

<script>
const pageData = {
    data: {
        role: "DATA ANALYST",
        about: "Data Analyst dengan latar belakang Teknik Industri. Ahli dalam mentransformasi data mentah menjadi wawasan strategis menggunakan SQL, Python, dan Visualisasi Data.",
        tech: [{n:"Excel", i:"fa-table"}, {n:"SQL", i:"fa-database"}, {n:"Python", i:"fa-python"}, {n:"Power BI", i:"fa-chart-column"}, {n:"Tableau", i:"fa-chart-line"}],
        soft: ["Analytical Problem Solving", "Data Storytelling", "Structured Thinking"],
        items: [
            { 
                t: "RevoGrocers Sales Analysis", 
                shortDesc: "RevoGrocers is a fictional grocery retailer operating multiple locations. The company aims to optimize revenue performance by reallocating resources from low-performing categories using data-driven insights.", 
                bg: "RevoGrocers facing performance challenges across several categories and aims to reallocate resources from low-growth segments.", 
                obj: "Identify top-performing product categories and analyze key revenue drivers including unit sold and pricing impact.", 
                meth: "Data Understanding & Sales Trend Analysis using SQL (BigQuery).", 
                res: "Identified Dual Revenue Drivers (Confections & Meat) and provided high-AUP premium product recommendations.", 
                img: "revogrocers_preview.jpg",
                deck: "https://github.com/FadilaUtami/Data-Portfolio/blob/main/RevoGrocers_Analysis/Intermediate%20SQL.pdf",
                code: "https://github.com/FadilaUtami/Data-Portfolio/blob/main/RevoGrocers_Analysis/Query.sql",
                tools: ["SQL", "BigQuery"]
            },
            { 
                t: "Supergoop! Performance Analysis", 
                shortDesc: "Comprehensive analysis of Supergoop!'s market position at Sephora, focusing on how product ratings and pricing influence online customer engagement and sales contribution.",
                bg: "Analyze the drivers of Supergoop!'s product ratings and online sales contribution at Sephora using 2023 product and customer review data.", 
                obj: "Identify key factors influencing customer ratings and sentiment to support recommendations for product improvement.", 
                meth: "Data Cleaning, Sentiment Analysis, and EDA using Python (Google Colab).", 
                res: "76% Positive reviews; Mini size products identified as high engagement drivers.", 
                img: "supergoop_preview.jpg",
                deck: "https://github.com/FadilaUtami/Data-Portfolio/blob/main/Supergoop!%20Performance%20Analysis%20at%20Sephora/Supergoop!%20Performance%20Analysis.pdf",
                code: "https://github.com/FadilaUtami/Data-Portfolio/blob/main/Supergoop!%20Performance%20Analysis%20at%20Sephora/Supergoop!%20Performance%20Analysis.ipynb",
                tools: ["Python", "Power BI"] 
            },
            { 
                t: "RevoBank Customer Segmentation", 
                shortDesc: "Evaluation of credit card transaction performance to identify user personas. This project helps the bank optimize marketing strategies based on customer behavior segments.",
                bg: "Evaluate credit card transaction performance and identify user personas to optimize marketing strategies.", 
                obj: "Segment customer base using behavioral and demographic data to identify high-value groups and measure fraud impact.", 
                meth: "K-Means Clustering using Python (Pandas, Scikit-Learn).", 
                res: "Defined 3 distinct personas. Cluster 1 identified as High-Value Active Users.", 
                img: "revobank_preview.jpg",
                deck: "https://github.com/FadilaUtami/Data-Portfolio/blob/main/RevoBank_Customer_Segmentation/FSDA%20OCT25%20_%20Intermediate%20Python.pdf",
                code: "https://github.com/FadilaUtami/Data-Portfolio/blob/main/RevoBank_Customer_Segmentation/FSDA%20OCT25%20_%20Intermediate%20Python.ipynb",
                tools: ["SQL", "Python"] 
            },
            { 
                t: "RevoFinance Dashboard", 
                shortDesc: "Personal finance visualization designed for end-users to track spending patterns. The dashboard provides clear visibility into annual expenses and budget utilization.",
                bg: "Users need clear visibility into spending patterns and budget usage across multiple categories.", 
                obj: "Build interactive dashboard to track Rp 509M annual expenses real-time.", 
                meth: "Data Blending & Visualization using Tableau.", 
                res: "Dashboard tracking expenses by category, merchant, and monthly trends.", 
                img: "revofinance_preview.jpg",
                deck: "https://github.com/FadilaUtami/Data-Portfolio/blob/main/RevoFinance%20Data%20Visualization/FSDA%20OCT25_DATAVIZ.pdf",
                code: "https://public.tableau.com/app/profile/fadila.utami",
                tools: ["Tableau", "Finance"] 
            }
        ]
    }
};

function updatePage(key) {
    const d = pageData[key] || pageData.data;
    document.getElementById('role-title').innerText = d.role;
    document.getElementById('about-desc').innerText = d.about;

    document.getElementById('contact-content').innerHTML = `
        <div class="stack-item item-neutral"><span>Padang (Open Relocation)</span></div>
        <div class="stack-item item-neutral"><span>LinkedIn: Fadila Utami</span></div>
        <div class="stack-item item-neutral"><span>fu.fadilautami@gmail.com</span></div>`;

    document.getElementById('edu-content').innerHTML = `
        <div class="stack-item item-primary"><b>Master of Science Industrial Engineering</b><span>UTM | 2021 – 2023</span></div>
        <div class="stack-item item-neutral"><b>Bachelor's Degree Industrial Engineering</b><span>Univ. Pancasila | 2014 – 2018</span></div>
        <div class="stack-item item-neutral"><b>Full stack Data Analytics Program</b><span>RevoU | 2025 – 2026</span></div>`;

    document.getElementById('cert-content').innerHTML = `
        <div class="stack-item item-neutral"><b>FSDA</b><span>RevoU</span></div>
        <div class="stack-item item-neutral"><b>Six Sigma Green Belt</b><span>SSAA</span></div>`;

    document.getElementById('tech-skills').innerHTML = d.tech.map(t => `<div class="tech-icon"><i class="fa-solid ${t.i}"></i>${t.n}</div>`).join('');
    document.getElementById('soft-skills').innerHTML = d.soft.map(s => `<span class="tag-box">${s}</span>`).join('');

    // RENDER KARTU PROYEK (Lengkap dengan Deskripsi & Deck di Depan)
    document.getElementById('project-list').innerHTML = d.items.map((item, index) => `
        <div class="project-card-front">
            <div class="section-title" style="font-size: 0.6rem;">PROJECT</div>
            <h4>${item.t}</h4>
            <p class="project-desc">${item.shortDesc}</p>
            <div class="front-footer">
                <div class="method-tags">
                    ${item.tools.map(tool => `<span class="tool-tag">${tool}</span>`).join('')}
                </div>
                <div style="display:flex; gap:8px;">
                    <a href="${item.deck}" target="_blank" class="btn-open-deck">View Deck</a>
                    <button onclick="openModal('${key}', ${index})" class="btn-open-deck" style="background:#444;">Details</button>
                </div>
            </div>
        </div>`).join('');
}

function openModal(k, i) {
    const item = pageData[k].items[i];
    document.getElementById('m-title').innerText = item.t;
    document.getElementById('m-bg').innerText = item.bg;
    document.getElementById('m-obj').innerText = item.obj;
    document.getElementById('m-meth').innerText = item.meth;
    document.getElementById('m-res').innerText = item.res;
    document.getElementById('m-image').src = item.img;
    document.getElementById('m-code').href = item.code;
    document.getElementById('projectModal').style.display = "block";
}

function closeModal() { document.getElementById('projectModal').style.display = "none"; }
updatePage('data');
</script>
</body>
</html>

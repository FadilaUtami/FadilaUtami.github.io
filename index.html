<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fadila Utami Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #004d40;
            --secondary-green: #1c766b;
            --accent-gold: #c5a059;
            --bg-light: #f3f5f6;
            --white: #ffffff;
            --gray-box: #ebedee;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); margin: 0; padding: 20px; }
        .container { width: 98%; max-width: 1400px; margin: auto; }

        /* HEADER & NAVIGATION */
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; }
        .header h3 { color: var(--primary-green); margin: 0; font-size: 1.5rem; }
        .role-nav { display: flex; background: #fff; border-radius: 30px; padding: 4px; border: 1px solid #ddd; }
        .role-btn { border: none; padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: 600; background: transparent; color: #666; font-size: 0.8rem; transition: 0.3s; }
        .role-btn.active { background: var(--primary-green); color: white; }

        /* BENTO GRID DENGAN GARIS MARGIN HIJAU TEBAL */
        .bento-grid { display: grid; grid-template-columns: 280px 240px 1.2fr 1.5fr; gap: 12px; margin-bottom: 12px; }
        .card { background: var(--white); border-radius: 12px; border: 3.5px solid var(--primary-green); padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .section-title { color: var(--accent-gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: bold; }

        /* PROFILE & ABOUT */
        .profile-card { grid-row: span 2; padding: 0; overflow: hidden; background: #000; display: flex; }
        .profile-card img { width: 100%; height: 100%; object-fit: cover; }
        .about-card { grid-column: span 3; position: relative; }
        .about-card h2 { color: var(--primary-green); margin: 0; font-size: 1.8rem; }
        .about-card .sub-role { color: var(--accent-gold); font-weight: bold; font-size: 1rem; margin-bottom: 10px; }
        .download-cv { position: absolute; top: 15px; right: 15px; border: 1.5px solid var(--primary-green); color: var(--primary-green); padding: 6px 15px; border-radius: 20px; text-decoration: none; font-size: 0.7rem; font-weight: bold; }

        /* STACKED ITEMS */
        .stack-container { display: flex; flex-direction: column; gap: 8px; }
        .stack-item { padding: 10px; border-radius: 10px; font-size: 0.8rem; display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: var(--gray-box); border: 1px solid #ddd; }
        .item-primary { background: var(--primary-green); color: white; border-color: var(--primary-green); display: block; }
        .item-primary b { color: var(--accent-gold); display: block; margin-bottom: 2px; }
        .item-neutral b { color: var(--primary-green); display: block; margin-bottom: 2px; }
        .item-neutral i { color: var(--secondary-green); font-size: 1rem; width: 18px; text-align: center; }

        /* EXPERIENCE SECTION */
        .exp-outer-card { border: 3.5px solid var(--primary-green); border-radius: 12px; padding: 20px; background: #fff; }
        .project-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .project-card-clickable { background: var(--gray-box); border: 1px solid #ddd; border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.3s; position: relative; }
        .project-card-clickable:hover { border-color: var(--primary-green); transform: translateY(-3px); background: #f0f4f3; }
        .project-card-clickable h4 { color: var(--primary-green); margin: 0 0 10px 0; }
        .tool-tag { font-size: 0.65rem; background: #fff; padding: 2px 8px; border-radius: 4px; margin-right: 5px; font-weight: bold; border: 1px solid #ddd; color: var(--primary-green); }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); overflow-y: auto; }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 30px; border: 3.5px solid var(--primary-green); width: 80%; max-width: 900px; border-radius: 15px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close-modal:hover { color: black; }

        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .modal-image { width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        .modal-info b { color: var(--secondary-green); }
        .modal-links { display: flex; gap: 15px; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .btn-modal { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; color: white; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .btn-deck { background: #d32f2f; }
        .btn-code { background: #1976d2; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3>My Portfolio</h3>
        <div class="role-nav">
            <button id="nav-data" class="role-btn active" onclick="updatePage('data')">DATA ANALYST</button>
            <button id="nav-ci" class="role-btn" onclick="updatePage('ci')">CONTINUOUS IMPROVEMENT</button>
            <button id="nav-pm" class="role-btn" onclick="updatePage('pm')">PROJECT MANAGEMENT</button>
        </div>
    </div>

    <div class="bento-grid">
        <div class="card profile-card"><img src="Profile.png" alt="Profile"></div>
        <div class="card about-card">
            <a href="fadila utami (Revisi)(W2).pdf" class="download-cv" target="_blank">DOWNLOAD CV</a>
            <div class="section-title">ABOUT ME</div>
            <h2 id="name">Fadila Utami</h2>
            <div id="role-title" class="sub-role">DATA ANALYST</div>
            <p id="about-desc" style="font-size: 0.85rem; line-height: 1.5; margin-top: 10px;"></p>
        </div>
        <div class="card"><div class="section-title">CONTACT</div><div id="contact-content" class="stack-container"></div></div>
        <div class="card"><div class="section-title">EDUCATION</div><div id="edu-content" class="stack-container"></div></div>
        <div class="card"><div class="section-title">CERTIFICATIONS</div><div id="cert-content" class="stack-container"></div></div>
    </div>

    <div class="exp-outer-card">
        <div id="exp-title" class="section-title">PROJECT EXPERIENCE</div>
        <div id="project-list" class="project-grid"></div>
    </div>
</div>

<div id="projectModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3 id="m-title" style="color: var(--primary-green); margin-top: 0;"></h3>
        <div class="modal-grid">
            <div>
                <img id="m-image" src="" alt="Dashboard Preview" class="modal-image">
            </div>
            <div class="modal-info">
                <p><b>Background:</b> <span id="m-bg"></span></p>
                <p><b>Objective:</b> <span id="m-obj"></span></p>
                <p><b>Method:</b> <span id="m-meth"></span></p>
                <p><b>Result:</b> <span id="m-res"></span></p>
            </div>
        </div>
        <div class="modal-links">
            <a id="m-deck" href="#" target="_blank" class="btn-modal btn-deck"><i class="fa-solid fa-file-powerpoint"></i> View Deck (PPT)</a>
            <a id="m-code" href="#" target="_blank" class="btn-modal btn-code"><i class="fa-solid fa-code"></i> BigQuery / Colab</a>
        </div>
    </div>
</div>

<script>
const pageData = {
    data: {
        role: "DATA ANALYST",
        about: "Dedicated Data Analyst with an Industrial Engineering background. Mastering SQL, Python, Power BI and Tableau to transform complex datasets into actionable insights.",
        items: [
            {
                t: "Supergoop! Performance Analysis",
                bg: "Analyze the drivers of Supergoop!'s product ratings and online sales contribution at Sephora using 2023 data.",
                obj: "Identify key factors influencing customer ratings and sentiment for product improvement.",
                meth: "Data Cleaning, Sentiment Analysis, and EDA using Python (Google Colab) & Power BI.",
                res: "76% positive reviews. Mini Size products identified as high engagement drivers.",
                img: "supergoop_dashboard.jpg", // Ganti dengan nama file gambar Anda
                deck: "link_ke_ppt.pdf",
                code: "link_ke_bigquery_atau_colab",
                tools: ["Python", "Power BI", "EDA"]
            },
            {
                t: "RevoBank Customer Segmentation",
                bg: "Evaluate credit card transaction performance and user personas to optimize marketing strategies.",
                obj: "Segment customer base using behavioral data to identify high-value groups.",
                meth: "K-Means Clustering using Python (Pandas, Scikit-Learn) on Google Colab.",
                res: "Defined 3 distinct personas. Cluster 1 identified as High-Value Active Users.",
                img: "revobank_preview.jpg", // Ganti dengan nama file gambar Anda
                deck: "link_ke_ppt_bank.pdf",
                code: "link_ke_colab_bank",
                tools: ["SQL", "Python", "K-Means"]
            }
        ]
    },
    ci: {
        role: "CONTINUOUS IMPROVEMENT ANALYST",
        about: "Expert in process optimization. Improved workflow efficiency by 30% through Lean principles and RCA.",
        items: [
            {
                t: "Workflow Optimization Project",
                bg: "Inefficiencies in cross-functional workflows at property operations.",
                obj: "Improve operational efficiency using Lean Manufacturing principles.",
                meth: "Root Cause Analysis (RCA) and Standardization of data entry.",
                res: "Improved workflow efficiency by 30% and zero reporting errors.",
                img: "ci_workflow.jpg",
                deck: "#", code: "#", tools: ["Lean", "RCA"]
            }
        ]
    },
    pm: {
        role: "PROJECT MANAGEMENT",
        about: "Proficient in managing project coordination and timelines using structured Gantt schedules.",
        items: [
            {
                t: "KPU Malaysia Election Coordination",
                bg: "Managing logistics for 5 sites during election periods.",
                obj: "100% operational success rate via precise timeline management.",
                meth: "Developed Gantt schedules and cross-functional team coordination.",
                res: "100% target achievement with zero downtime.",
                img: "pm_election.jpg",
                deck: "#", code: "#", tools: ["Gantt", "Logistics"]
            }
        ]
    }
};

function updatePage(key) {
    const d = pageData[key];
    document.getElementById('role-title').innerText = d.role;
    document.getElementById('about-desc').innerText = d.about;
    
    // Update Contact, Edu, Cert (Statis agar rapi)
    document.getElementById('contact-content').innerHTML = `<div class="stack-item item-neutral"><i class="fa-solid fa-location-dot"></i> <span>Padang (Open Relocation)</span></div><a href="#" class="stack-item item-neutral"><i class="fa-brands fa-linkedin"></i> <span>LinkedIn: Fadila</span></a>`;
    document.getElementById('edu-content').innerHTML = `<div class="stack-item item-primary"><b>Master of Industrial Engineering</b><span>UTM | 2021-2023</span></div>`;
    document.getElementById('cert-content').innerHTML = `<div class="stack-item item-neutral"><b>Full-stack Data Analytics</b><span>RevoU</span></div>`;

    // Render Project Cards
    document.getElementById('project-list').innerHTML = d.items.map((item, index) => `
        <div class="project-card-clickable" onclick="openModal('${key}', ${index})">
            <div class="section-title" style="font-size: 0.6rem;">CLICK TO VIEW DETAILS</div>
            <h4>${item.t}</h4>
            <div style="margin-top:10px;">${item.tools.map(tool => `<span class="tool-tag">${tool}</span>`).join('')}</div>
        </div>
    `).join('');

    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-' + key).classList.add('active');
}

function openModal(key, index) {
    const item = pageData[key].items[index];
    document.getElementById('m-title').innerText = item.t;
    document.getElementById('m-bg').innerText = item.bg;
    document.getElementById('m-obj').innerText = item.obj;
    document.getElementById('m-meth').innerText = item.meth;
    document.getElementById('m-res').innerText = item.res;
    document.getElementById('m-image').src = item.img;
    document.getElementById('m-deck').href = item.deck;
    document.getElementById('m-code').href = item.code;
    
    document.getElementById('projectModal').style.display = "block";
}

function closeModal() {
    document.getElementById('projectModal').style.display = "none";
}

window.onclick = function(event) {
    if (event.target == document.getElementById('projectModal')) { closeModal(); }
}

updatePage('data');
</script>
</body>
</html>
